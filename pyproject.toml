[project]
name = "creditguard-ai"
version = "0.1.0"
description = "CreditGuard AI 授信智能合规审查平台"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "jieba>=0.42,<1",
  "numpy>=2,<3",
  "faiss-cpu>=1.11,<2",
  "pyyaml>=6.0,<7",
  "langgraph>=0.6,<1",
  "langgraph-checkpoint-sqlite>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "pyright>=1.1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP042"]

[tool.pyright]
include = ["backend/app", "backend/tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
